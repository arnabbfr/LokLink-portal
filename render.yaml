services:
  - type: web
    name: loklink-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/issues
    envVars:
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: 20.x
